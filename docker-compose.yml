services:
  # MongoDB - Original Case Document and Template Store
  mongodb:
    image: mongo:latest
    container_name: nyaya-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Qdrant - High-Performance Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyaya-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
